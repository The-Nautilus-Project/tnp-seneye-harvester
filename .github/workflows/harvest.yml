name: Harvest nursery readings

on:
  schedule:
    # every 30 minutes; GitHub's scheduler is best-effort, so a run can be late
    # or skipped when the service is busy. The harvester is idempotent, so a
    # missed run only costs the readings the Seneye API had at that moment.
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    # Publishing to Pages lives in this workflow's publish job, so a change to
    # the dashboard itself used to sit in the repository until the next harvest
    # happened to run. Editing index.html now redeploys the site.
    #
    # dashboard/data is excluded on purpose: the harvest job commits the JSON
    # and CSV there, and without that exclusion each run would trigger the next
    # one for ever.
    paths:
      - "dashboard/**"
      - "!dashboard/data/**"
      - "config.json"

# No workflow-level concurrency. It used to be here, one group called
# "harvest" covering the whole run, and that turned out to be the thing that
# jammed the repository: the publish job waits on the github-pages environment,
# so a deploy that stalls holds the lock for the harvest job as well. Every
# scheduled run then queued behind a run that was never going to finish, and
# GitHub cancelled each one in turn with "a higher priority waiting request for
# harvest exists".
#
# The two jobs below hold their own locks instead. Harvests serialise against
# each other and against an import, because they write to the same SQLite file.
# Pages deploys serialise against each other, because GitHub allows one at a
# time. Neither can block the other any more.

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  harvest:
    runs-on: ubuntu-latest
    # A hung job used to hold the lock until GitHub's own six-hour ceiling.
    # A harvest that has not finished in ten minutes is stuck, not slow.
    timeout-minutes: 10
    concurrency:
      group: harvest
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # No third-party packages are needed for the default SQLite backend.
      # If DATABASE_URL points at Postgres or MySQL, set the DB_DRIVER
      # repository variable to the driver to install, e.g. psycopg[binary].
      - name: Install optional database driver
        if: vars.DB_DRIVER != ''
        run: pip install ${{ vars.DB_DRIVER }}

      - name: Harvest
        env:
          SENEYE_USER: ${{ secrets.SENEYE_USER }}
          SENEYE_PWD: ${{ secrets.SENEYE_PWD }}
          # Read-only Tuya access, for the chiller plugs and the air sensor.
          # Absent secrets are an empty string, which the harvester reports and
          # steps over rather than failing the run.
          TUYA_ACCESS_ID: ${{ secrets.TUYA_ACCESS_ID }}
          TUYA_ACCESS_SECRET: ${{ secrets.TUYA_ACCESS_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          # A push is somebody uploading a file, not a reason to poll Seneye and
          # Tuya. Rebuilding the export from what is already stored picks up a
          # config.json change and takes seconds, so uploading a batch of files
          # no longer parks a queue of full harvests behind the scheduled one.
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "push event: rebuilding the export, not polling the sensors"
            python -m harvester.harvest --export-only
          else
            python -m harvester.harvest
          fi

      # With no DATABASE_URL the SQLite file and the exports live in the repo,
      # which keeps the whole thing free and self-contained.
      - name: Commit data
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -n "$DATABASE_URL" ]; then
            echo "external database in use, nothing to commit"
            exit 0
          fi
          git config user.name "tnp-harvester"
          git config user.email "actions@users.noreply.github.com"
          # Add only what exists: the sheet cache is absent until the first
          # successful fetch, and git add fails outright on a missing path.
          for f in data/nursery.db data/nutrients_latest.csv \
                   dashboard/data/nursery.json dashboard/data/readings.csv; do
            [ -f "$f" ] && git add -f "$f"
          done
          git diff --quiet --cached || git commit -m "harvest: readings at $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash origin ${GITHUB_REF_NAME} || true
          git push

  publish:
    needs: harvest
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 10
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard
      - id: deploy
        uses: actions/deploy-pages@v4
